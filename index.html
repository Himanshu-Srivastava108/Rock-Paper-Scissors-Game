<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Rock Paper Scissors</h1>
  <div class="choices">
    <div class="choice" id="rock">
      <img src="./rock.png">
    </div>
    <div class="choice" id="paper">
      <img src="./paper.png">
    </div>
    <div class="choice" id="scissors">
      <img src="./scissors.png">
    </div>
  </div>
  <p id="round-info">Round 0/9</p>
  <div class="score-board">
    <div class="score">
      <p id="user-score">0</p>
      <p>You</p>
    </div>
    <div class="score">
      <p id="comp-score">0</p>
      <p>Comp</p>
    </div>
  </div>

  <div class="msg-container">
    <p id="msg">Play your move</p>
  </div>
  <button id="restart-btn">Play Again</button>
  <footer class="creator">
    <p>🎮 Created by <strong>Himanshu Srivastava</strong></p>
    <p>
      <a href="linkedin.com/in/himanshu-srivastava-407511399" target="_blank">LinkedIn</a>
      |
      <a href="https://www.instagram.com/himanshu_srivastava108?utm_source=qr&igsh=MXN3cHZjcnZ2dWZvOQ==" target="_blank">Instagram</a>
    </p>
</footer>
  <script src="app.js"></script>
</body>
</html>
